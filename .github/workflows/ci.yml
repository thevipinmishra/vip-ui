name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://vip-ui.dev
      NEXT_PUBLIC_REGISTRY_URL: https://vip-ui.dev
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test:registry

      - run: pnpm exec next typegen

      - run: pnpm exec tsc --noEmit

      - name: Check registry is in sync
        run: |
          pnpm registry:build
          git diff --exit-code -- public/r registry.json registry/generated
          test -z "$(git status --porcelain -- public/r registry.json registry/generated)"

      - run: pnpm exec next build
